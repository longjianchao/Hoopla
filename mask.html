<script type="text/javascript">
	var src = "images/Figure_29.png";
	imgname = src.split('/').pop().split('.')[0];
	var ms;
	var masks = [];
	var maskMode = 'maskInner';
	var img;

	// ============================================================
	// 新增：保留原始 FITS 浮点数据（不经任何归一化）
	// ============================================================
	var originalFitsData = null;   // { data: Float32Array, width, height, yFlipped }
	var originalFitsHeaderCards = null;  // 保留原 header cards，写回时尽量复用

	ms = new MarkingSurface({
		inputName: 'mass-model',
		tool: MarkingSurface.CircleTool,
	});
	containerEl = document.getElementById("MaskContainer");
	containerEl.appendChild(ms.el);
	var masks = [];
	maskMode = ''; // 默认模式

	var img = new Image();
	img.onload = function () {
		let width = img.width;
		let height = img.height;

		ms.addShape('image', {
			'xlink:href': img.src,
			width: width,
			height: height
		});
		ms.svg.attr({
			width: width,
			height: height
		});
		ms.rescale(0, 0, width, height);
		let scaleX = width / img.width;
		let scaleY = height / img.height;

		function updateModel() {
			let data = JSON.parse(ms.getValue());
			console.log('Raw data:', data);

			if (Array.isArray(data)) {
				data.forEach(function (item) {
					// 检查是否为圆形数据（有x, y, r属性）
					if (item.hasOwnProperty('x') && item.hasOwnProperty('y') && item.hasOwnProperty('r')) {
						let id = item.id;
						// 查找是否已存在该圆形
						let existingIndex = masks.findIndex(mask => mask.id === id);
						let circleData = {
							id: id,
							x: item.x,
							y: item.y,
							r: item.r,
							mode: existingIndex >= 0 ? masks[existingIndex].mode : 'maskInner' // 保留原有mode或设为默认
						};

						if (existingIndex >= 0) {
							// 更新现有圆形的位置和大小
							masks[existingIndex] = circleData;
						} else {
							// 添加新圆形
							circleData.mode = maskMode;
							masks.push(circleData);
						}
					}
				});

				// 清理不存在的圆形（可选，用于处理删除情况）
				let dataIds = data.map(item => item.id).filter(id => id);
				masks = masks.filter(mask => dataIds.includes(mask.id));
				console.log('Updated masks:', masks);
			} else {
				console.log('No circle data found');
			}
		}
		let debouncedUpdateModel = _.debounce(updateModel, 200);
		ms.on('marking-surface:change', debouncedUpdateModel);
	}
	img.src = src;


	function setMaskMode(mode) {
		maskMode = mode; // 设置新圆形的默认mode
		console.log('Mask mode set to:', maskMode);

		// 更新UI显示
		let modeText = document.getElementById('current-mode');
		if (modeText) {
			modeText.textContent = mode;
			modeText.style.color = mode === 'maskInner' ? '#ff6b6b' : '#4ecdc4';
		}
		updateMaskStats();
	}

	function updateMaskStats() {
		let innerCount = masks.filter(m => m.mode === 'maskInner').length;
		let outerCount = masks.filter(m => m.mode === 'maskOuter').length;

		let innerSpan = document.getElementById('inner-count');
		let outerSpan = document.getElementById('outer-count');

		if (innerSpan) innerSpan.textContent = `${innerCount} × maskInner`;
		if (outerSpan) outerSpan.textContent = `${outerCount} × maskOuter`;
	}

	function updateFitsStatus() {
		let el = document.getElementById('fits-info');
		if (!el) return;
		if (originalFitsData) {
			el.textContent = `loaded (${originalFitsData.width} × ${originalFitsData.height}, float32, original range preserved)`;
			el.style.color = '#4ecdc4';
		} else {
			el.textContent = 'not loaded';
			el.style.color = '#aaa';
		}
	}

	function clearMasks() {
		masks = [];
		if (ms) {
			ms.reset(); // 使用MarkingSurface的reset方法清除所有圆形组件
		}
		updateMaskStats();
		document.getElementById('result-container').innerHTML = '';
		console.log('All masks cleared');
	}

	// 上传图像函数 - 支持普通图像和FITS文件
	function uploadImage() {
		let input = document.createElement('input');
		input.type = 'file';
		input.accept = 'image/*,.fits,.fit,.fts';
		input.onchange = function (e) {
			let file = e.target.files[0];
			if (file) {
				let fileName = file.name.toLowerCase();
				imgname = file.name.split('.')[0];

				// 新图像加载：清掉旧的 FITS 浮点数据
				originalFitsData = null;
				originalFitsHeaderCards = null;
				updateFitsStatus();

				if (fileName.endsWith('.fits') || fileName.endsWith('.fit') || fileName.endsWith('.fts')) {
					// 处理FITS文件
					handleFITSFile(file);
				} else {
					// 处理普通图像文件
					handleImageFile(file);
				}
			}
		};
		input.click();
		// Masked Image图像清空
		document.getElementById('result-container').innerHTML = '';
		masks = [];
		ms.reset();
	}

	// 处理普通图像文件
	function handleImageFile(file) {
		let url = window.URL.createObjectURL(file);
		img.src = url;
	}

	// 处理FITS文件：保留原始浮点数据 + 生成显示用 PNG
	function handleFITSFile(file) {
		new astro.FITS(file, function (fits) {
			const hdu = fits.getHDU();
			const header = hdu.header;
			const dataUnit = hdu.data;
			const width = header.get('NAXIS1');
			const height = header.get('NAXIS2');
			const convert = true;  // 和 getImage 里的翻转行为对齐

			// 保留 header cards 供写回时使用（尽力而为）
			try {
				originalFitsHeaderCards = [];
				if (header.cards) {
					// astro.js 的 header.cards 可能是对象或数组，两种情况都处理
					if (Array.isArray(header.cards)) {
						originalFitsHeaderCards = header.cards.slice();
					} else if (typeof header.cards === 'object') {
						for (let k in header.cards) {
							if (header.cards.hasOwnProperty(k)) {
								originalFitsHeaderCards.push({ key: k, value: header.cards[k] });
							}
						}
					}
				}
			} catch (err) {
				console.warn('Could not preserve original FITS header cards:', err);
				originalFitsHeaderCards = null;
			}

			dataUnit.getFrame(0, function (imageData) {
				// ============================================================
				// 关键：保存原始浮点数据（未归一化！）
				// imageData 是 TypedArray（Float32/Float64），复制一份以防后续被改
				// ============================================================
				originalFitsData = {
					data: new Float32Array(imageData),
					width: width,
					height: height,
					yFlipped: convert  // 记录显示时是否做了 Y 翻转
				};
				updateFitsStatus();
				// 用循环计算 min/max，避免 Math.min/max spread 在大数组上栈溢出
				let _vmin = Infinity, _vmax = -Infinity;
				for (let i = 0; i < originalFitsData.data.length; i++) {
					const v = originalFitsData.data[i];
					if (v < _vmin) _vmin = v;
					if (v > _vmax) _vmax = v;
				}
				console.log(`FITS loaded: ${width}×${height}, range [${_vmin.toExponential(3)}, ${_vmax.toExponential(3)}]`);

				// 生成显示用 URL（只影响画面，不影响 originalFitsData）
				const url = getImage(imageData, width, height, convert);
				img.src = url;
			});
		});
	}

	// 上传masks函数
	function uploadMasks() {
		masks = [];
		ms.reset();
		let input = document.createElement('input');
		input.type = 'file';
		input.accept = '.json';
		input.onchange = function (e) {
			let file = e.target.files[0];
			if (file) {
				let reader = new FileReader();
				reader.onload = function (e) {
					try {
						let loadedMasks = JSON.parse(e.target.result);
						if (Array.isArray(loadedMasks)) {
							masks = loadedMasks;
							// 清空现有的圆形
							if (ms) {
								ms.reset();
							}
							// 重新绘制加载的masks
							masks.forEach(mask => {
								if (mask.x !== undefined && mask.y !== undefined && mask.r !== undefined) {
									let tool = new MarkingSurface.CircleTool();
									tool.mark.set({
										x: mask.x,
										y: mask.y,
										r: mask.r,
										mode: mask.mode || 'maskInner',
										id: mask.id
									});
									ms.addTool(tool);
								}
							});
							updateMaskStats();
							console.log('Masks uploaded successfully');
						}
					} catch (error) {
						console.error('Error loading masks:', error);
						alert('Error loading masks file');
					}
				};
				reader.readAsText(file);
			}
		};
		input.click();
	}

	// 保存图像函数 - 直接使用右侧显示的masked image（PNG，仅用于可视化分享）
	function saveImage() {
		let resultContainer = document.getElementById('result-container');
		let resultImg = resultContainer.querySelector('img');

		if (!resultImg || !resultImg.src) {
			alert('No masked image to save. Please apply masks first.');
			return;
		}
		let link = document.createElement('a');
		link.download = imgname + '_masked.png';
		link.href = resultImg.src;
		link.click();
	}

	// ============================================================
	// 新增：把 mask 应用到原始浮点数据，保存为标准 FITS 文件
	// 关键特性：
	//   1) 只对原始浮点数据做 "置零/保留" 操作，不做任何归一化
	//   2) 未被 mask 的像素 bit-for-bit 与输入一致
	//   3) 坐标系翻转与显示对齐（处理 FITS 的 Y 轴向上约定）
	// ============================================================
	function saveMaskedFITS() {
		if (!originalFitsData) {
			alert('No FITS data loaded.\n\nSave Masked FITS 只在加载 FITS 文件后可用。\n普通 PNG/JPG 没有浮点科学数据，请用 "Save Image (PNG)"。');
			return;
		}
		if (masks.length === 0) {
			alert('No masks defined. Nothing to apply.');
			return;
		}

		const { data: srcData, width, height, yFlipped } = originalFitsData;

		// 复制原始数据（绝不修改原始数据）
		const maskedData = new Float32Array(srcData);

		// 分类 mask
		const innerMasks = masks.filter(m => m.mode === 'maskInner');
		const outerMasks = masks.filter(m => m.mode === 'maskOuter');

		// 遍历 FITS 数据坐标 (xFits, yFits)，对应的显示坐标按 yFlipped 转换
		let erasedCount = 0;
		for (let yFits = 0; yFits < height; yFits++) {
			// 显示坐标系下的 y
			const yDisp = yFlipped ? (height - 1 - yFits) : yFits;
			for (let xFits = 0; xFits < width; xFits++) {
				const xDisp = xFits;  // x 不翻转

				// 判断该显示坐标是否被 inner / outer mask 覆盖
				let inAnyInner = false;
				for (let i = 0; i < innerMasks.length; i++) {
					const m = innerMasks[i];
					const dx = xDisp - m.x;
					const dy = yDisp - m.y;
					if (dx * dx + dy * dy <= m.r * m.r) { inAnyInner = true; break; }
				}
				let inAnyOuter = false;
				for (let i = 0; i < outerMasks.length; i++) {
					const m = outerMasks[i];
					const dx = xDisp - m.x;
					const dy = yDisp - m.y;
					if (dx * dx + dy * dy <= m.r * m.r) { inAnyOuter = true; break; }
				}

				// maskInner: 圆内擦除；maskOuter: 圆外擦除
				let shouldErase = false;
				if (innerMasks.length > 0 && inAnyInner) shouldErase = true;
				if (outerMasks.length > 0 && !inAnyOuter) shouldErase = true;

				if (shouldErase) {
					maskedData[yFits * width + xFits] = 0;  // 保持 float32，数据范围不变
					erasedCount++;
				}
				// 未被擦除的像素完全不动，bit-for-bit 与原始一致
			}
		}

		// 诊断：打印保留数据的范围，确认没有被归一化
		let vmin = Infinity, vmax = -Infinity;
		for (let i = 0; i < maskedData.length; i++) {
			const v = maskedData[i];
			if (v < vmin) vmin = v;
			if (v > vmax) vmax = v;
		}
		console.log(`Masked FITS: erased ${erasedCount}/${maskedData.length} pixels, ` +
			`value range [${vmin.toExponential(4)}, ${vmax.toExponential(4)}]`);

		// 写出 FITS
		const filename = imgname + '_masked.fits';
		writeFITSFile(maskedData, width, height, filename, originalFitsHeaderCards);

		alert(`Saved: ${filename}\n` +
			`Shape: ${width} × ${height}, float32\n` +
			`Erased pixels: ${erasedCount}\n` +
			`Data range: [${vmin.toExponential(3)}, ${vmax.toExponential(3)}]\n` +
			`原始数据范围已保持，可直接用于后端建模。`);
	}

	// ============================================================
	// 轻量 FITS writer：单 HDU，BITPIX=-32（float32），big-endian
	// 严格遵循 FITS 标准：
	//   - header 每行 80 字符，整体填充到 2880 字节倍数
	//   - 数据段 big-endian，填充到 2880 字节倍数
	// ============================================================
	function writeFITSFile(data, width, height, filename, extraHeaderCards) {
		// -------- 构造 header --------
		// 必需卡片放最前，按 FITS 标准顺序
		const cards = [];
		cards.push(formatFitsCard('SIMPLE', 'T', 'conforms to FITS standard'));
		cards.push(formatFitsCard('BITPIX', -32, '32-bit IEEE floating point'));
		cards.push(formatFitsCard('NAXIS', 2, 'number of data axes'));
		cards.push(formatFitsCard('NAXIS1', width, 'length of x axis'));
		cards.push(formatFitsCard('NAXIS2', height, 'length of y axis'));
		cards.push(formatFitsCard('BZERO', 0.0, 'offset (0 for float32)'));
		cards.push(formatFitsCard('BSCALE', 1.0, 'scale (1 for float32)'));
		cards.push(formatFitsCard('EXTEND', 'T', 'FITS dataset may contain extensions'));

		// 尽可能保留原 header 里的有用信息（WCS、曝光信息、仪器等）
		// 跳过我们自己会写的结构性卡片
		const structuralKeys = new Set([
			'SIMPLE', 'BITPIX', 'NAXIS', 'NAXIS1', 'NAXIS2',
			'BZERO', 'BSCALE', 'EXTEND', 'END',
			'XTENSION', 'PCOUNT', 'GCOUNT'
		]);
		if (extraHeaderCards && Array.isArray(extraHeaderCards)) {
			extraHeaderCards.forEach(card => {
				if (!card || !card.key) return;
				const key = String(card.key).trim().toUpperCase();
				if (structuralKeys.has(key)) return;
				if (key === 'COMMENT' || key === 'HISTORY') {
					cards.push(formatFitsCommentCard(key, String(card.value || '')));
				} else {
					// 保守：只写能格式化的值，失败就跳过
					try {
						cards.push(formatFitsCard(key, card.value, ''));
					} catch (err) {
						// ignore
					}
				}
			});
		}

		// 追加来源信息
		cards.push(formatFitsCommentCard('HISTORY', 'Masked by Hoopla on ' + new Date().toISOString()));
		cards.push(formatFitsCommentCard('HISTORY', 'Masked pixels set to 0.0; other pixels unchanged.'));

		cards.push('END'.padEnd(80, ' '));

		// 拼接 header，填充到 2880 字节倍数
		let headerStr = cards.join('');
		const headerPad = (2880 - (headerStr.length % 2880)) % 2880;
		headerStr = headerStr + ' '.repeat(headerPad);
		const headerBytes = new TextEncoder().encode(headerStr);

		// -------- 构造数据段（big-endian float32）--------
		const dataByteLen = data.length * 4;
		const dataBuffer = new ArrayBuffer(dataByteLen);
		const dv = new DataView(dataBuffer);
		for (let i = 0; i < data.length; i++) {
			dv.setFloat32(i * 4, data[i], false);  // false => big-endian，FITS 要求
		}
		const dataPad = (2880 - (dataByteLen % 2880)) % 2880;

		// -------- 合并并下载 --------
		const finalBuffer = new Uint8Array(headerBytes.length + dataByteLen + dataPad);
		finalBuffer.set(headerBytes, 0);
		finalBuffer.set(new Uint8Array(dataBuffer), headerBytes.length);
		// padding 默认为 0

		const blob = new Blob([finalBuffer], { type: 'application/octet-stream' });
		const link = document.createElement('a');
		link.download = filename;
		link.href = URL.createObjectURL(blob);
		link.click();
		URL.revokeObjectURL(link.href);

		console.log(`FITS file written: ${filename}, header ${headerBytes.length}B, data ${dataByteLen}B + ${dataPad}B pad`);
	}

	// 格式化标准 FITS 卡片：8 字符 keyword + "= " + 20 字符 value + " / " + comment，总 80 字符
	function formatFitsCard(key, value, comment) {
		const keyStr = String(key).toUpperCase().padEnd(8, ' ').substring(0, 8);
		let valueStr;
		if (typeof value === 'boolean') {
			valueStr = (value ? 'T' : 'F').padStart(20, ' ');
		} else if (typeof value === 'number') {
			if (Number.isInteger(value)) {
				valueStr = String(value).padStart(20, ' ');
			} else {
				// 浮点：科学计数法或普通格式，保证长度 ≤ 20
				let s = value.toExponential(12);
				// FITS 习惯用大写 E
				s = s.replace('e', 'E');
				if (s.length > 20) s = value.toExponential(8).replace('e', 'E');
				if (s.length > 20) s = value.toExponential(4).replace('e', 'E');
				valueStr = s.padStart(20, ' ');
			}
		} else if (typeof value === 'string') {
			// 单字符 T/F 当布尔值，否则加引号
			if (value === 'T' || value === 'F') {
				valueStr = value.padStart(20, ' ');
			} else {
				// FITS 字符串：单引号包裹，最少 8 字符内容
				let s = value.replace(/'/g, "''");
				if (s.length < 8) s = s.padEnd(8, ' ');
				// 整个带引号字段尽量控制在 20 字符以内（短字符串情况），否则会挤占 comment 空间
				valueStr = "'" + s + "'";
				// 不强行 padStart，FITS 允许字符串卡片值对齐不同
				valueStr = valueStr.padEnd(20, ' ');
			}
		} else {
			valueStr = String(value).padStart(20, ' ');
		}

		// 拼接：keyword(8) + '= '(2) + value(20) + ' / '(3) + comment 直到 80 字符
		let card = keyStr + '= ' + valueStr;
		if (comment) {
			card += ' / ' + comment;
		}
		if (card.length > 80) card = card.substring(0, 80);
		return card.padEnd(80, ' ');
	}

	// COMMENT / HISTORY 卡片：关键字占 8 字符，其余全是文本
	function formatFitsCommentCard(key, text) {
		const keyStr = String(key).toUpperCase().padEnd(8, ' ').substring(0, 8);
		let body = String(text);
		// 剩余可用字符数 = 80 - 8 = 72
		if (body.length > 72) body = body.substring(0, 72);
		return (keyStr + body).padEnd(80, ' ');
	}

	// 保存masks函数
	function saveMasks() {
		if (masks.length === 0) {
			alert('No masks to save');
			return;
		}
		let dataStr = JSON.stringify(masks, null, 2);
		let dataBlob = new Blob([dataStr], { type: 'application/json' });
		let link = document.createElement('a');

		// 添加时间戳到文件名
		let timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
		link.download = imgname + '_masks_' + timestamp + '.json';

		link.href = URL.createObjectURL(dataBlob);
		link.click();
	}

	// 保存mask圈中的像素数据为HDF5格式（包含矩阵数据）
	function saveMaskData() {
		if (masks.length === 0) {
			alert('No masks to save data from');
			return;
		}
		if (!img || !img.src) {
			alert('No image loaded');
			return;
		}
		// 创建canvas来获取原始图像数据
		const canvas = document.createElement('canvas');
		const ctx = canvas.getContext('2d');

		// 使用图像的原始尺寸
		const imgWidth = img.naturalWidth || img.width;
		const imgHeight = img.naturalHeight || img.height;

		canvas.width = imgWidth;
		canvas.height = imgHeight;

		// 绘制图像到canvas
		ctx.drawImage(img, 0, 0, imgWidth, imgHeight);

		// 获取图像数据
		const imageData = ctx.getImageData(0, 0, imgWidth, imgHeight);
		const data = imageData.data;

		// 将RGB转换为灰度值
		const grayData = new Float32Array(imgHeight * imgWidth);
		for (let i = 0; i < imgHeight * imgWidth; i++) {
			const r = data[i * 4];
			const g = data[i * 4 + 1];
			const b = data[i * 4 + 2];
			grayData[i] = (r + g + b) / 3; // 灰度值
		}

		// 创建HDF5兼容的保存数据结构
		const maskData = {
			image_info: {
				width: imgWidth,
				height: imgHeight,
				filename: imgname,
				timestamp: new Date().toISOString()
			},
			full_image_gray: {
				data: grayData,
				shape: [imgHeight, imgWidth],
				dtype: "<f4"
			},
			masks: {}
		};

		// 为每个mask提取数据
		masks.forEach((mask, index) => {
			// 计算mask区域的边界框
			const minX = Math.max(0, Math.floor(mask.x - mask.r));
			const maxX = Math.min(imgWidth - 1, Math.ceil(mask.x + mask.r));
			const minY = Math.max(0, Math.floor(mask.y - mask.r));
			const maxY = Math.min(imgHeight - 1, Math.ceil(mask.y + mask.r));

			const width = maxX - minX + 1;
			const height = maxY - minY + 1;

			// 创建mask区域的数据矩阵
			const maskPixels = new Float32Array(height * width);
			const validPixels = [];
			let pixelIndex = 0;

			for (let y = 0; y < height; y++) {
				for (let x = 0; x < width; x++) {
					const globalX = minX + x;
					const globalY = minY + y;

					// 检查是否在圆内
					const dx = globalX - mask.x;
					const dy = globalY - mask.y;
					const distance = Math.sqrt(dx * dx + dy * dy);

					if (distance <= mask.r) {
						// 在圆内，获取像素值
						const pixelIndex2 = globalY * imgWidth + globalX;
						maskPixels[pixelIndex] = grayData[pixelIndex2] || 0;
						validPixels.push(grayData[pixelIndex2] || 0);
					} else {
						// 在圆外，设为NaN表示无效数据
						maskPixels[pixelIndex] = NaN;
					}
					pixelIndex++;
				}
			}

			// 保存mask信息
			maskData.masks[`mask_${index + 1}`] = {
				metadata: {
					index: index + 1,
					x: mask.x,
					y: mask.y,
					radius: mask.r,
					mode: mask.mode,
					bounding_box: {
						min_x: minX,
						min_y: minY,
						max_x: maxX,
						max_y: maxY,
						width: width,
						height: height
					},
					valid_pixel_count: validPixels.length
				},
				pixels: {
					data: maskPixels,
					shape: [height, width],
					dtype: "<f4"
				},
				valid_pixels: {
					data: new Float32Array(validPixels),
					shape: [validPixels.length],
					dtype: "<f4"
				}
			};
		});

		try {
			// 转换为JSON字符串（HDF5兼容格式）
			const jsonStr = JSON.stringify(maskData, (key, value) => {
				if (value instanceof Float32Array) {
					return Array.from(value);
				}
				return value;
			}, 2);

			// 创建并下载文件 - 添加时间戳
			const blob = new Blob([jsonStr], { type: 'application/json' });
			const link = document.createElement('a');

			let timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
			link.download = imgname + '_mask_data_' + timestamp + '.h5.json';

			link.href = URL.createObjectURL(blob);
			link.click();

			console.log('Mask data saved successfully as HDF5-compatible JSON:', maskData);
			alert('Mask data saved as HDF5-compatible JSON file!\n\n文件包含：\n- 完整图像灰度数据\n- 每个mask的像素矩阵\n- mask元数据（位置、半径等）\n\n可以用Python的h5py或pandas读取处理');
		} catch (error) {
			console.error('Error saving mask data:', error);
			alert('Error saving mask data. Please check the console for details.');
		}
	}

	function toggleCircleMode(circleId) {
		let index = masks.findIndex(m => m.id === circleId);
		if (index !== -1) {
			masks[index].mode = masks[index].mode === 'maskInner' ? 'maskOuter' : 'maskInner';
			updateMaskStats();
			console.log('Toggled circle mode:', circleId, 'new mode:', masks[index].mode);
		}
	}

	function applyMasksToImage() {
		console.log('Applying masks:', masks);
		if (masks.length === 0) {
			console.log('No masks to apply');
			return;
		}
		// 获取原始图像
		let originalImg = img;
		if (!originalImg) {
			console.error('No image found');
			return;
		}
		// 获取MaskContainer的尺寸用于对齐
		let maskContainer = document.getElementById('MaskContainer');
		let containerRect = maskContainer.getBoundingClientRect();
		let imgRect = originalImg.getBoundingClientRect();

		// 创建canvas来处理图像，保持与显示图像相同的尺寸
		let canvas = document.createElement('canvas');
		let ctx = canvas.getContext('2d');

		// 使用显示图像的实际尺寸，确保对齐
		let displayWidth = originalImg.clientWidth || originalImg.width;
		let displayHeight = originalImg.clientHeight || originalImg.height;

		// 设置canvas尺寸与显示图像一致
		canvas.width = originalImg.naturalWidth || originalImg.width;
		canvas.height = originalImg.naturalHeight || originalImg.height;

		// 绘制原始图像
		ctx.drawImage(originalImg, 0, 0);

		// 获取图像数据
		let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
		let data = imageData.data;

		// 分类处理mask
		let innerMasks = masks.filter(m => m.mode === 'maskInner');
		let outerMasks = masks.filter(m => m.mode === 'maskOuter');

		for (let y = 0; y < canvas.height; y++) {
			for (let x = 0; x < canvas.width; x++) {
				let index = (y * canvas.width + x) * 4;

				// 检查像素位置
				let inAnyInnerCircle = innerMasks.some(mask => {
					let dx = x - mask.x;
					let dy = y - mask.y;
					return Math.sqrt(dx * dx + dy * dy) <= mask.r;
				});

				let inAnyOuterCircle = outerMasks.some(mask => {
					let dx = x - mask.x;
					let dy = y - mask.y;
					return Math.sqrt(dx * dx + dy * dy) <= mask.r;
				});

				// 应用mask规则
				let shouldErase = false;

				if (innerMasks.length > 0 && inAnyInnerCircle) {
					// maskInner模式：圆内数据擦除置零
					shouldErase = true;
				}

				if (outerMasks.length > 0 && !inAnyOuterCircle) {
					// maskOuter模式：圆外数据擦除置零
					shouldErase = true;
				}

				if (shouldErase) {
					data[index] = 0;     // R
					data[index + 1] = 0; // G
					data[index + 2] = 0; // B
				}
			}
		}

		// 将处理后的图像数据放回canvas
		ctx.putImageData(imageData, 0, 0);

		// 获取已存在的result-container
		let resultDiv = document.getElementById('result-container');
		resultDiv.innerHTML = ''; // 清空之前的内容
		resultDiv.style.padding = '0'; // 移除内边距确保对齐

		let resultImg = document.createElement('img');
		resultImg.src = canvas.toDataURL();
		resultImg.style.maxWidth = '100%';
		resultImg.style.maxHeight = 'none'; // 移除高度限制
		resultImg.style.border = 'none'; // 移除边框确保对齐
		resultImg.style.borderRadius = '0'; // 移除圆角确保对齐
		resultImg.style.display = 'block'; // 确保图像对齐

		resultDiv.appendChild(resultImg);

		console.log('Masks applied successfully');
		updateMaskStats();
	}

</script>
